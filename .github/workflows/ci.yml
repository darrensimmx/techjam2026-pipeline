name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  requirements-contract:
    name: Requirements contract (schema, never-raises, no-network)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      # Modules are named EXPLICITLY, not discovered, so a new test file does
      # not run until it is listed here. Every tests.test_src_* module below was
      # added with the src/ rebuild; the four starter/ modules that lead the list
      # are unchanged and stay green.
      #
      # tests.test_bakeoff_llmrr is the one entry that does NOT test the shipped
      # agent -- it guards the LLM-rerank measurement harness in bakeoff/. It is
      # listed here because that harness decides whether a paid run's numbers
      # mean anything. It may only import bakeoff.llmrr_contract, which is
      # standard-library only: this step installs the comments-only
      # requirements.txt, so importing the probe itself (which reaches
      # bakeoff.dense -> numpy) would break the build.
      - name: Contract + ledger/scheduler + offline + P1 safety tests, and the src/ unit + static checks
        run: >-
          python -m unittest
          tests.test_agent_contract tests.test_ledger_scheduler tests.test_offline tests.test_p1_offline_safety
          tests.test_src_agent tests.test_src_askpolicy tests.test_src_contract tests.test_src_frames
          tests.test_src_layering tests.test_src_layers tests.test_src_ledger tests.test_src_no_network
          tests.test_src_overlap tests.test_src_pipeline tests.test_src_rerank tests.test_src_retrieval
          tests.test_src_semantic_rung3 tests.test_src_shown tests.test_src_slots
          tests.test_bakeoff_llmrr
          tests.test_demo_tracer_targets
          -v

  barebone-app-smoke:
    name: Barebone app smoke test (CLI endpoint connects, session ends by turn 10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: CLI integration + real-evaluator smoke tests, and the src/ end-to-end assembly proof
        run: python -m unittest tests.test_cli_integration tests.test_evaluator_smoke tests.test_src_end_to_end tests.test_demo_trace -v
